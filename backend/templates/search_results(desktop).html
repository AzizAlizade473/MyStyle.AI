{% extends "base(desktop).html" %}

{% block content %}
    <main class="flex-1 p-8 overflow-y-auto animate-fade-in" x-data="searchResultsComponent()">
        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2">Search Results</h2>
            <p class="text-gray-500 font-semibold" x-text="'Found ' + allResults.length + ' matches'"></p>
        </div>

        <!-- Results Grid -->
        <div id="searchResultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <template x-for="item in allResults" :key="item.id">
                <div @click="openItemDetail(item)" class="bg-white rounded-[32px] border border-gray-100 overflow-hidden hover:border-black transition-all cursor-pointer group shadow-sm">
                    <!-- Image -->
                    <div class="aspect-[3/4] bg-gray-50 overflow-hidden relative">
                        <img :src="item.image" alt="Item" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        
                        <!-- Score Badge -->
                        <div class="absolute top-4 right-4 bg-black text-white px-3 py-1 rounded-full text-xs font-black">
                            <span x-text="Math.round(item.score * 100) + '% Match'"></span>
                        </div>

                        <!-- Vintage Badge -->
                        <template x-if="item.tags?.style && item.tags.style.includes('Vintage')">
                            <div class="absolute bottom-4 left-4 right-4 bg-green-900 text-white text-[9px] text-center font-black py-2 rounded-full uppercase tracking-widest">
                                Vintage
                            </div>
                        </template>
                    </div>

                    <!-- Details -->
                    <div class="p-6">
                        <!-- Header with Source Badge -->
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-xs font-black uppercase tracking-widest text-gray-400" x-text="item.tags?.color || 'Item'"></p>
                                <h3 class="text-xl font-bold tracking-tight mt-1" x-text="item.tags?.type || 'Unknown'"></h3>
                            </div>
                            <span class="text-[9px] font-black text-white bg-black px-3 py-1 rounded-full" x-text="item.source === 'LOCAL' ? 'IN STORE' : 'WEB'"></span>
                        </div>

                        <!-- Location/Market -->
                        <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-4">
                            <span x-text="item.source === 'LOCAL' ? item.market_location : item.market_name"></span>
                        </p>

                        <!-- Tags -->
                        <div class="flex flex-wrap gap-2 mb-4">
                            <template x-if="item.tags?.material">
                                <span class="text-[9px] bg-gray-100 px-3 py-1 rounded-full font-semibold text-gray-700">
                                    <span x-text="item.tags.material"></span>
                                </span>
                            </template>
                            <template x-if="item.tags?.style">
                                <span class="text-[9px] bg-gray-100 px-3 py-1 rounded-full font-semibold text-gray-700">
                                    <span x-text="item.tags.style"></span>
                                </span>
                            </template>
                        </div>

                        <!-- CTA -->
                        <button class="w-full bg-gray-50 hover:bg-black hover:text-white px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-widest transition-all active:scale-95">
                            View Details
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <template x-if="allResults.length === 0">
            <div class="col-span-full text-center py-20">
                <p class="text-gray-400 text-lg font-semibold">No results found</p>
            </div>
        </template>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('searchResultsComponent', () => ({
                allResults: [],

                init() {
                    // Get results from sessionStorage or from URL query parameter
                    const stored = sessionStorage.getItem('searchResults');
                    if (stored) {
                        this.allResults = JSON.parse(stored);
                        sessionStorage.removeItem('searchResults');
                    }
                },

                openItemDetail(item) {
                    sessionStorage.setItem('selectedItem', JSON.stringify(item));
                    // Navigate to detail page or open modal
                    console.log('Opening item detail:', item);
                }
            }));
        });
    </script>
{% endblock %}
