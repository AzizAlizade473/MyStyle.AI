<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espresso Desktop - AI Stylist</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"DM Sans"', 'sans-serif'] },
                    colors: { 
                        black: '#000000', 
                        white: '#FFFFFF',
                        gray: { 50: '#F9F9F9', 100: '#F5F5F5', 200: '#E5E5E5', 400: '#A3A3A3', 500: '#737373', 900: '#171717' }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    
    <style>
        [x-cloak] { display: none !important; }
        .sidebar-item { transition: all 0.2s; border-radius: 12px; margin-bottom: 4px; }
        .sidebar-item.active { background: #000; color: #fff; }
        .sidebar-item:not(.active):hover { background: #f5f5f5; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ccc; }
        
        /* Animation */
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white text-black antialiased h-screen overflow-hidden font-sans">
    <div class="flex h-full w-full">
                <!-- ================= 1. SIDEBAR ================= -->
        <aside id="sidebar" class="w-64 border-r border-gray-100 flex flex-col p-6 shrink-0 bg-white hidden" x-data="sidebarComponent()">
            <div class="mb-12">
                <h1 class="text-2xl font-bold tracking-tighter italic">Espresso.</h1>
            </div>

            <nav class="flex-1">
                <button @click="window.location.href = isHome? '#' : '{% url 'home' %}'" :class="isHome ? 'active' : ''" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 text-sm font-bold text-gray-400">
                    <i class="fas fa-home w-5"></i> Dashboard
                </button>
                <button :class="isWardrobe ? 'active' : ''" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 text-sm font-bold text-gray-400">
                    <i class="fas fa-layer-group w-5"></i> My Closet
                </button>
                <button @click="window.location.href = isProfile? '#' : '{% url 'profile_page' %}'" :class="isProfile ? 'active' : ''" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 text-sm font-bold text-gray-400">
                    <i class="fas fa-user-circle w-5"></i> Profile
                </button>
            </nav>

            <div class="mt-auto border-t border-gray-100 pt-6">
                <div class="flex items-center gap-3 mb-6 px-2">
                    <div id="UserInitials" class="w-10 h-10 bg-black rounded-full text-white flex items-center justify-center font-bold"></div>
                    <div class="flex-1 overflow-hidden">
                        <p id="UserName" class="font-bold text-sm truncate"></p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Premium Member</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full text-left text-red-500 text-xs font-bold uppercase px-4 py-2 hover:bg-red-50 rounded-lg">Log Out</button>
            </div>
        </aside>
        {% block content %}{% endblock %}
    </div>
</body>
{% block scripts %}
    {{ block.super }}
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("userToken");
            const sidebar = document.getElementById("sidebar");

            if (!token || !sidebar) return;

            try {
                const response = await fetch("/api/auth/profile/", {
                    headers: {
                        "Authorization": `Token ${token}`
                    }
                });

                if (response.ok) {
                    sidebar.classList.remove("hidden");
                    const data = await response.json();
                    document.querySelector('#UserInitials').innerText = data.username.charAt(0).toUpperCase();
                    document.querySelector('#UserName').innerText = data.username;
                } else {
                    localStorage.removeItem("userToken");
                }
            } catch (err) {
                console.error("Auth check failed");
            }
        });

        window.logout = function logout() {
            localStorage.removeItem('userToken');
            window.location.href = "{% url 'login' %}";
        }

        function sidebarComponent() {
            return {
                isHome: window.location.pathname === '{% url "home" %}',
                isWardrobe: window.location.pathname === '#',
                isProfile: window.location.pathname === '{% url "profile_page" %}',
            }
        }
    </script>
{% endblock %}
</html>
