<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Stylist</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        form { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <form id="loginForm">
        <h2>Sign In</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div id="errorMsg" class="error"></div>
        <p><a href="register.html">Need an account? Register</a></p>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            try {
                // 1. Send Login Request
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 2. SAVE THE TOKEN
                    localStorage.setItem('userToken', data.token);
                    // 3. Redirect to Home
                    window.location.href = 'index.html';
                } else {
                    errorDiv.innerText = "Invalid credentials";
                }
            } catch (err) {
                errorDiv.innerText = "Server Error";
            }
        });
    </script>
</body>
</html>
