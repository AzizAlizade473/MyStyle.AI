{% extends 'base(desktop).html' %}

{% block content %}
<div class="flex-1 overflow-y-auto p-10 bg-white">
    <div class="max-w-4xl">
        <div class="mb-12">
            <p id="loading"></p>
        </div>
        <h2 class="text-4xl font-bold tracking-tighter">Account Settings</h2>
        <h2 class="text-4xl tracking-tighter mb-8" x-text="t('hello_user')"></h2>
        
        <div id="errorDiv" class="bg-red-50 border border-red-200 text-red-600 text-sm font-bold rounded-lg p-4 mb-12 hidden">
            <p id="errorMsg"></p>
        </div>

        <div class="grid grid-cols-2 gap-12">
            <div class="space-y-12">
                <div>
                    <h3 class="text-[10px] font-black text-gray-300 uppercase tracking-[0.3em] mb-6" x-text="t('vis_idn')"></h3>
                    <div class="flex items-center gap-6">
                        <div id="ProfileP" class="w-24 h-24 rounded-full bg-black flex items-center justify-center text-4xl font-bold text-white shadow-2xl"></div>
                        <div>
                            <h4 class="text-2xl font-bold" id="Username"></h4>
                            <h4 class="text-2xl" id="Email"></h4>
                            <p class="text-gray-400">Verified Style Icon • Baku, AZ</p>
                        </div>
                    </div>
                </div>
                <div>
                    <h3 class="text-[10px] font-black text-gray-300 uppercase tracking-[0.3em] mb-6" x-text="t('per_info')"></h3>
                    <div class="space-y-6">
                        <div class="flex justify-between items-center py-4 border-b border-gray-200">
                            <span class="font-bold text-sm" x-text="t('gender')"></span>
                            <span class="text-xs font-black text-black" id="Gender"></span>
                        </div>
                        <div class="flex justify-between items-center py-4 border-b border-gray-200">
                            <span class="font-bold text-sm" x-text="t('prefs')"></span>
                            <span class="text-xs font-black text-black" id="Prefs"></span>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-[10px] font-black text-gray-300 uppercase tracking-[0.3em] mb-6" x-text="t('my_sizes')"></h3>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="p-6 border border-gray-100 rounded-[24px] text-center cursor-pointer hover:border-black bg-gray-50 transition-all">
                            <p class="text-[10px] font-black text-gray-400 mb-1" x-text="t('cat_top')"></p>
                            <p class="font-bold text-2xl" id="Top"></p>
                        </div>
                        <div class="p-6 border border-gray-100 rounded-[24px] text-center cursor-pointer hover:border-black bg-gray-50 transition-all">
                            <p class="text-[10px] font-black text-gray-400 mb-1" x-text="t('cat_pants')"></p>
                            <p class="font-bold text-2xl" id="Bottom"></p>
                        </div>
                        <div class="p-6 border border-gray-100 rounded-[24px] text-center cursor-pointer hover:border-black bg-gray-50 transition-all">
                            <p class="text-[10px] font-black text-gray-400 mb-1" x-text="t('cat_shoes')"></p>
                            <p class="font-bold text-2xl" id="Shoe"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 rounded-[40px] p-10 border border-gray-100">
                    <h3 class="text-lg font-bold mb-6" x-text="t('per_info')"></h3>
                    <div class="space-y-6">
                    <div class="flex justify-between items-center py-4 border-b border-gray-200">
                        <span class="font-bold text-sm" x-text="t('lang_pref')"></span>
                        <div class="flex gap-4">
                        <button @click="lang='az'" :class="lang==='az' ? 'text-black border-b-2 border-black' : 'text-gray-300'" class="text-xs font-black uppercase pb-1">AZ</button>
                        <button @click="lang='en'" :class="lang==='en' ? 'text-black border-b-2 border-black' : 'text-gray-300'" class="text-xs font-black uppercase pb-1">EN</button>
                    </div>
                    </div>
                    <div class="flex justify-between items-center py-4 border-b border-gray-200">
                        <span class="font-bold text-sm" x-text="t('currency')"></span>
                        <span class="text-xs font-black text-black">AZN (₼)</span>
                    </div>
                    <button onclick="logout()" class="w-full text-center text-red-500 font-black text-xs uppercase tracking-widest pt-8" x-text="t('logout')"></button>
                    </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    {{ block.super }}
    <script>
        // Call page-specific loader provided by ui.js
        if (typeof loadProfile === 'function') loadProfile();
    </script>
{% endblock %}
