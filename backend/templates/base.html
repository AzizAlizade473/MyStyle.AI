<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Stylist{% endblock %}</title>
    <style>
        /* Shared Styles */
        
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        
        /* Navbar */
        .navbar {
            position: fixed; top: 0; width: 100%; height: 50px;
            background: #333; color: white; display: flex; align-items: center;
            padding: 0 20px; justify-content: space-between;
        }
        .navbar a { color: white; text-decoration: none; margin-left: 15px; cursor: pointer; }
        .navbar .brand { font-weight: bold; font-size: 1.2em; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .error { color: red; }
        form { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="navbar">
        <div class="brand">MyStyle AI</div>
        <div id="navLinks"></div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // --- GLOBAL AUTH LOGIC ---
        function updateNav() {
            const token = localStorage.getItem('userToken');
            const nav = document.getElementById('navLinks');

            if (token) {
                // User is Logged In
                nav.innerHTML = `
                    <a href="{% url 'home' %}">Home</a>
                    <a href="#" onclick="logout()">Sign Out</a>
                `;
            } else {
                // User is Guest
                nav.innerHTML = `
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}">Register</a>
                `;
            }
        }

        // --- SIGN OUT FUNCTION ---
        function logout() {
            // 1. Remove the key
            localStorage.removeItem('userToken');
            // 2. Redirect to Login
            window.location.href = '/login/';
        }

        // Run on every page load
        updateNav();
    </script>
</body>
</html>
