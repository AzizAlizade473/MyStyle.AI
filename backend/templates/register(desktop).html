{% extends 'base(desktop).html' %}

{% block content %}
<!-- ================= 0.5 REGISTER PAGE (NEW ADDITION) ================= -->
<div class="w-full h-full flex animate-fade-in">
    <!-- Left: Brand Visual -->
    <div class="w-5/12 bg-black relative flex flex-col justify-between p-16 text-white overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1000')] bg-cover bg-center opacity-40 grayscale mix-blend-screen"></div>
        <div class="relative z-10">
            <div class="w-16 h-16 border-2 border-white rounded-full flex items-center justify-center mb-6">
                <span class="text-3xl font-bold italic">E</span>
            </div>
        </div>
        <div class="relative z-10">
            <h1 class="text-6xl font-bold tracking-tighter leading-tight mb-6">Style,<br>Simplified.</h1>
            <p class="text-gray-400 text-sm max-w-xs leading-relaxed">Your personalized AI stylist. Digitalize your wardrobe, find matches from local boutiques, and elevate your daily look.</p>
        </div>
    </div>

    <!-- Right: Auth Form -->
    <form class="w-7/12 bg-white flex flex-col justify-center items-center relative" id="registerForm">
        <!-- Lang Switcher Top Right -->

        <!------------------------------- UNDER DEVELOPMENT -------------------------------->
        <div class="absolute top-10 right-10 flex gap-4">
            <button @click="lang='az'" :class="lang==='az' ? 'text-black border-b-2 border-black' : 'text-gray-300'" class="text-xs font-black uppercase pb-1">AZ</button>
            <button @click="lang='en'" :class="lang==='en' ? 'text-black border-b-2 border-black' : 'text-gray-300'" class="text-xs font-black uppercase pb-1">EN</button>
        </div>
        <!---------------------------------------------------------------------------------->

        <div class="w-7/12 bg-white flex flex-col justify-center items-center relative">

            <div class="w-full max-w-md px-10">
                <div class="mb-10">
                    <h2 class="text-4xl font-bold tracking-tighter mb-2" x-text="authMode === 'login' ? t[lang].sign_in : t[lang].create_account"></h2>
                    <p class="text-gray-400 font-medium" x-text="t[lang].auth_subtitle"></p>
                </div>

                <div class="space-y-6">
                    <!-- Username Field -->
                    <div class="animate-fade-in">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Username</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="text" id="username" placeholder="username" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" required>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="animate-fade-in">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Email</label>
                        <div class="relative">
                            <i class="fas fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="email" id="email" placeholder="email" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" required>
                        </div>
                    </div>

                    <!--  Optional Full Name Field -->
                    <div class="animate-fade-in">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Full Name (Optional)</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="text" id="first_name" placeholder="first name" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all">
                        </div>
                        <div class="relative mt-3">
                            <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="text" id="last_name" placeholder="last name" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all">
                        </div>
                    </div>

                    <!-- Passwords -->
                    <div class="animate-fade-in">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Password</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="password" id="password" placeholder="Password" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" required>
                        </div>
                        <div class="relative mt-3">
                            <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                            <input type="password" id="password_confirm" placeholder="Password Confirm" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 pl-12 pr-4 font-bold text-sm focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" required>
                        </div>
                    </div>
                </div>

                <!-- Message Container -->
                <div>
                    <div class="relative mt-6 h-6 flex items-center hidden" id="messageContainer">
                        <div class="hidden" id="message"></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-black text-white py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] mt-10 shadow-2xl hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-3">
                    <span>Register</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Switch Auth Mode Link-->
                <div class="mt-6 text-center text-gray-400 text-xs">
                    <span class="text-gray-400">Already have an account? <a href="{% url 'login' %}" class="text-black font-bold underline">Login</a></span>
                </div>
            </div>
        </div>
    </form>
</div>
<!-- ================= END OF AUTH PAGE ================= -->
{% endblock %}
