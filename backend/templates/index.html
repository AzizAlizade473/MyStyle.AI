{% extends 'base.html' %}

{% block title %}Dashboard - AI Stylist{% endblock %}

{% block content %}
    <h1>Inventory Dashboard</h1>

    <div class="section" id="uploadSection">
        <h2>1. Upload Inventory</h2>
        <input type="file" id="fileInput" accept="image/*">
        <select id="sourceInput" onchange="toggleLocalFields()">
             <option value="AMAZON">Amazon</option>
             </select>
        <button onclick="uploadImage()">Upload</button>
        <div id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>2. Search</h2>
        <input type="text" id="searchInput" placeholder="Search...">
        <button onclick="searchImages()">Search</button>
        <div id="searchResults"></div>
    </div>

    <script>
        token = localStorage.getItem('userToken');

        if (!token) {
            document.querySelector('.section').innerHTML = `
            <h2>1. Upload Inventory</h2>
            <p>You must be logged in to access this page.</p>
            <a href="login.html">Go to Login</a>
            `;
        }
        // --- TOGGLE LOGIC ---
        function toggleLocalFields() {
            const source = document.getElementById('sourceInput').value;
            const localDiv = document.getElementById('localFields');
            // Show div only if 'LOCAL' is selected
            localDiv.style.display = (source === 'LOCAL') ? 'block' : 'none';
        }

        // --- UPLOAD LOGIC ---
        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const sourceInput = document.getElementById('sourceInput');
            const marketName = document.getElementById('marketName');
            const marketLocation = document.getElementById('marketLocation');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Please select a file first.";
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            
            // 1. Add Source
            formData.append('source', sourceInput.value);

            // 2. Add Local Details (only if Local is selected)
            if (sourceInput.value === 'LOCAL') {
                formData.append('market_name', marketName.value);
                formData.append('market_location', marketLocation.value);
            }

            statusDiv.innerHTML = "Uploading...";

            try {
                const response = await fetch('/api/core/upload/', { // Note: Check if your URL is /api/upload/ or /api/core/upload/ based on previous steps
                    method: 'POST',
                    headers: { 'Authorization': `Token ${token}` },
                    body: formData
                });
                
                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `<span class="success">Saved! (ID: ${data.id})</span><br>Source: ${data.source}`;
                } else {
                    statusDiv.innerHTML = `<span class="error">Error: ${JSON.stringify(data)}</span>`;
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `<span class="error">Network Error</span>`;
            }
        }

        // --- SEARCH LOGIC ---
        async function searchImages() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            const token = localStorage.getItem('userToken'); // <--- Get the Token

            if (!query) return;

            resultsDiv.innerHTML = "Searching...";

            try {
                // ADD HEADERS HERE
                const response = await fetch(`/api/core/search/?q=${encodeURIComponent(query)}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Token ' + token, // <--- Send the Key
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();

                if (response.ok) {
                    resultsDiv.innerHTML = "";
                    if (data.length === 0) {
                        resultsDiv.innerHTML = "No matches found.";
                        return;
                    }

                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <img src="${item.url}" alt="Result">
                            <div>
                                <strong>Score: ${item.score}</strong><br>
                                ID: ${item.id}
                            </div>
                        `;
                        resultsDiv.appendChild(div);
                    });
                } else {
                    resultsDiv.innerHTML = `<span class="error">Error: ${JSON.stringify(data)}</span>`;
                }
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<span class="error">Network Error</span>`;
            }
        }
    </script>
</body>
</html>
{% endblock %}
