upstream backend_api {
    server backend:8000;
}

server {
    listen 80;

    # 1. Serve the Frontend (HTML/JS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to Django
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Serve the Admin Panel
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Serve User Uploaded Images (Media)
    location /media/ {
        alias /app/media/;
    }
    
    # 5. Serve Django Static files (CSS for Admin panel)
    # You might need to run 'collectstatic' later, but this is the setup
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}