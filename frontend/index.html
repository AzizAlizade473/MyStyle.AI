<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Image Search Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .section { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        h2 { margin-top: 0; }
        .result-item { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding: 10px 0; }
        img { max-width: 100px; border-radius: 4px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>AI Vision Dashboard</h1>

    <div class="section">
        <h2>1. Upload Inventory</h2>
        
        <div style="margin-bottom: 10px;">
            <label>Select Image:</label><br>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div style="margin-bottom: 10px;">
            <label>Item Source:</label><br>
            <select id="sourceInput" onchange="toggleLocalFields()">
                <option value="AMAZON">Amazon</option>
                <option value="TEMU">Temu</option>
                <option value="TRENDYOL">Trendyol</option>
                <option value="LOCAL">Local Market</option>
            </select>
        </div>

        <div id="localFields" style="display: none; border-left: 3px solid #007bff; padding-left: 10px; margin-bottom: 10px;">
            <p style="margin: 5px 0; font-size: 0.9em; color: #666;">Local Seller Details:</p>
            <input type="text" id="marketName" placeholder="Market Name (e.g. Baku Mall)" style="margin-bottom: 5px; width: 100%;"><br>
            <input type="text" id="marketLocation" placeholder="Location/Address" style="width: 100%;">
        </div>

        <button onclick="uploadImage()" style="margin-top: 10px;">Upload & Process</button>
        <div id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>2. Search Images</h2>
        <input type="text" id="searchInput" placeholder="e.g., 'a red dress' or 'cat'">
        <button onclick="searchImages()">Search</button>
        <div id="searchResults"></div>
    </div>

    <script>
        token = localStorage.getItem('userToken');

        if (!token) {
            document.querySelector('.section').innerHTML = `
            <h2>1. Upload Inventory</h2>
            <p>You must be logged in to access this page.</p>
            <a href="login.html">Go to Login</a>
            `;
        }
        // --- TOGGLE LOGIC ---
        function toggleLocalFields() {
            const source = document.getElementById('sourceInput').value;
            const localDiv = document.getElementById('localFields');
            // Show div only if 'LOCAL' is selected
            localDiv.style.display = (source === 'LOCAL') ? 'block' : 'none';
        }

        // --- UPLOAD LOGIC ---
        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const sourceInput = document.getElementById('sourceInput');
            const marketName = document.getElementById('marketName');
            const marketLocation = document.getElementById('marketLocation');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Please select a file first.";
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            
            // 1. Add Source
            formData.append('source', sourceInput.value);

            // 2. Add Local Details (only if Local is selected)
            if (sourceInput.value === 'LOCAL') {
                formData.append('market_name', marketName.value);
                formData.append('market_location', marketLocation.value);
            }

            statusDiv.innerHTML = "Uploading...";

            try {
                const response = await fetch('/api/core/upload/', { // Note: Check if your URL is /api/upload/ or /api/core/upload/ based on previous steps
                    method: 'POST',
                    headers: { 'Authorization': `Token ${token}` },
                    body: formData
                });
                
                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `<span class="success">Saved! (ID: ${data.id})</span><br>Source: ${data.source}`;
                } else {
                    statusDiv.innerHTML = `<span class="error">Error: ${JSON.stringify(data)}</span>`;
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `<span class="error">Network Error</span>`;
            }
        }

        // --- SEARCH LOGIC ---
        async function searchImages() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');

            if (!query) return;

            resultsDiv.innerHTML = "Searching...";

            try {
                const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (response.ok) {
                    resultsDiv.innerHTML = "";
                    if (data.length === 0) {
                        resultsDiv.innerHTML = "No matches found.";
                        return;
                    }

                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <img src="${item.url}" alt="Result">
                            <div>
                                <strong>Score: ${item.score}</strong><br>
                                ID: ${item.id}
                            </div>
                        `;
                        resultsDiv.appendChild(div);
                    });
                } else {
                    resultsDiv.innerHTML = `<span class="error">Error: ${JSON.stringify(data)}</span>`;
                }
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<span class="error">Network Error</span>`;
            }
        }
    </script>
</body>
</html>
