<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        form { display: flex; flex-direction: column; width: 300px; gap: 10px; }
        input { padding: 10px; }
        button { padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 10px; color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <form id="registerForm">
        <h2>Create Account</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="text" id="first_name" placeholder="First Name (Optional)">
        <input type="text" id="last_name" placeholder="Last Name (Optional)">
        <input type="email" id="email" placeholder="Email (Optional)">
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="password_confirm" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
        <div id="message"></div>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Stop page from reloading

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            const messageDiv = document.getElementById('message');

            // 1. Prepare the data
            const data = {
                username: username,
                email: email,
                first_name: first_name,
                last_name: last_name,
                password: password,
                password_confirm: password_confirm
            };

            try {
                // 2. Send POST request to Django
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // 3. Handle response
                if (response.ok) {
                    messageDiv.className = '';
                    messageDiv.innerText = result.message;
                    document.getElementById('registerForm').reset();
                } else {
                    messageDiv.className = 'error';
                    // Show specific error from Django (e.g., "Username already exists")
                    messageDiv.innerText = JSON.stringify(result); 
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.className = 'error';
                messageDiv.innerText = "Network error. Is the backend running?";
            }
        });
    </script>
</body>
</html>
