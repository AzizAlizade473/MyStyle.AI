services:
  # 1. The Database (Pre-loaded with pgvector)
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  # 2. The Message Broker
  redis:
    image: redis:alpine

  # 3. The Backend API
  backend:
    build: ./backend  # You need a Dockerfile here
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./media_local:/app/media  # Local storage for dev
      - static_volume:/app/static
      - clip_cache:/root/.cache/clip
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 4. The AI Worker
  celery:
    build: ./backend  # Reuses the same code as backend
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./media_local:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 5. The Web Server
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html  # Your HTML/JS goes here
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./media_local:/app/media # So Nginx can serve the images users uploaded
      - static_volume:/app/static
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  clip_cache: